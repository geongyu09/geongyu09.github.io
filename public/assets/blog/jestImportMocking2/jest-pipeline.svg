<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" width="840" height="660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="840" height="660" fill="#fafafa" rx="12"/>

  <!-- CLI 호출 -->
  <text x="215" y="34" text-anchor="middle" font-size="13" fill="#71717a">CLI 호출</text>
  <line x1="215" y1="42" x2="215" y2="64" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1열 -->
  <rect x="40" y="70" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="60" y="98" font-size="15" font-weight="bold" fill="#27272a">1 · jest / jest-cli</text>
  <text x="60" y="122" font-size="13" fill="#71717a">CLI 인자를 받아 jest-cli에 위임</text>

  <line x1="215" y1="150" x2="215" y2="176" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="180" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="60" y="206" font-size="15" font-weight="bold" fill="#27272a">2 · jest-config</text>
  <text x="60" y="228" font-size="13" fill="#71717a">설정 파일 + CLI 인자 병합</text>
  <text x="60" y="248" font-size="13" fill="#71717a">→ GlobalConfig 1개 / ProjectConfig N개</text>

  <line x1="215" y1="260" x2="215" y2="286" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="290" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="60" y="316" font-size="15" font-weight="bold" fill="#27272a">3 · jest-haste-map</text>
  <text x="60" y="338" font-size="13" fill="#71717a">파일 목록 + 의존성 그래프 생성·캐싱</text>
  <text x="60" y="358" font-size="13" fill="#71717a">(jest-worker로 병렬 처리)</text>

  <line x1="215" y1="370" x2="215" y2="396" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="400" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="60" y="428" font-size="15" font-weight="bold" fill="#27272a">4 · SearchSource</text>
  <text x="60" y="452" font-size="13" fill="#71717a">입력한 패턴과 맞는 테스트 파일 선별</text>

  <line x1="215" y1="480" x2="215" y2="506" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="510" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="60" y="536" font-size="15" font-weight="bold" fill="#27272a">5 · TestSequencer</text>
  <text x="60" y="558" font-size="13" fill="#71717a">실행 순서 결정</text>
  <text x="60" y="578" font-size="13" fill="#71717a">(실패한 테스트 먼저 → 느린 테스트 먼저)</text>

  <!-- 1열 → 2열 연결 -->
  <path d="M390,550 L420,550 L420,110 L442,110" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2열 -->
  <rect x="450" y="70" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="470" y="96" font-size="15" font-weight="bold" fill="#27272a">6 · TestScheduler</text>
  <text x="470" y="118" font-size="13" fill="#71717a">순차 실행 vs 워커 분산 실행 결정</text>
  <text x="470" y="138" font-size="13" fill="#71717a">(jest-runner로 교체 가능)</text>

  <line x1="625" y1="150" x2="625" y2="176" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="180" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="470" y="206" font-size="15" font-weight="bold" fill="#27272a">7 · jest-circus</text>
  <text x="470" y="228" font-size="13" fill="#71717a">describe / it / beforeEach 제공</text>
  <text x="470" y="248" font-size="13" fill="#71717a">(워커 프로세스 안에서 실행)</text>

  <line x1="625" y1="260" x2="625" y2="286" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="290" width="350" height="230" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="318" font-size="15" font-weight="bold" fill="#27272a">8 · jest-runtime ★ 모듈 로딩 + 모킹</text>

  <rect x="470" y="332" width="310" height="172" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="486" y="354" font-size="12" fill="#71717a">vm 모듈로 만든 격리 컨텍스트</text>
  <text x="625" y="380" text-anchor="middle" font-size="13" fill="#27272a">테스트 코드의 require</text>
  <text x="625" y="398" text-anchor="middle" font-size="12" fill="#a1a1aa">↓</text>
  <text x="625" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b82f6">requireModuleOrMock</text>
  <text x="625" y="434" text-anchor="middle" font-size="12" fill="#a1a1aa">↓</text>
  <text x="625" y="452" text-anchor="middle" font-size="13" fill="#27272a">shouldMock ?</text>
  <text x="625" y="474" text-anchor="middle" font-size="12" fill="#71717a">예 → mock (가짜 모듈) · 아니오 → 진짜 모듈</text>
  <text x="625" y="494" text-anchor="middle" font-size="11" fill="#71717a">registry는 테스트마다 따로 관리</text>

  <line x1="625" y1="520" x2="625" y2="546" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="550" width="350" height="80" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="470" y="576" font-size="15" font-weight="bold" fill="#27272a">9 · TestResult → Reporter</text>
  <text x="470" y="598" font-size="13" fill="#71717a">결과가 직렬화되어 워커 경계를 넘어 취합</text>
  <text x="470" y="618" font-size="13" fill="#71717a">콘솔 출력 → 종료 코드 결정</text>
</svg>
