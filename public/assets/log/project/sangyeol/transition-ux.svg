<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a968c"/>
    </marker>
    <marker id="drag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d3f"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="#f8f7f3"/>

  <text x="64" y="92" font-size="36" font-weight="700" fill="#1f2420">사용성 테스트에서 「앱처럼 부드럽다」고 답한 비율</text>
  <text x="64" y="134" font-size="22" fill="#6b6f69">프리렌더링과 슬라이드 전환, 스와이프 뒤로가기를 넣기 전과 후</text>

  <!-- 핵심 지표 -->
  <rect x="64" y="176" width="536" height="292" rx="20" fill="#ffffff" stroke="#e4e1d9" stroke-width="2"/>
  <text x="96" y="224" font-size="24" font-weight="600" fill="#6b6f69">앱처럼 부드럽다는 응답</text>
  <text x="90" y="324" font-size="104" font-weight="800" fill="#2f5d3f" letter-spacing="-3">89%</text>
  <text x="326" y="324" font-size="28" font-weight="600" fill="#1f2420">45%에서 상승</text>
  <text x="96" y="384" font-size="22" fill="#4d514b">넣기 전</text>
  <rect x="200" y="362" width="153" height="30" rx="4" fill="#b5b0a4"/>
  <text x="365" y="385" font-size="22" font-weight="700" fill="#1f2420">45%</text>
  <text x="96" y="434" font-size="22" fill="#4d514b">넣은 뒤</text>
  <rect x="200" y="412" width="303" height="30" rx="4" fill="#2f5d3f"/>
  <text x="515" y="435" font-size="22" font-weight="700" fill="#1f2420">89%</text>

  <!-- 미리 그려 두기 -->
  <rect x="64" y="500" width="536" height="204" rx="20" fill="#ffffff" stroke="#e4e1d9" stroke-width="2"/>
  <text x="96" y="544" font-size="24" font-weight="700" fill="#1f2420">다음 페이지를 미리 그려 두기</text>
  <g font-size="20" fill="#1f2420" text-anchor="middle">
    <rect x="96" y="568" width="140" height="104" rx="14" fill="#efede7"/>
    <text x="166" y="612">링크 호버,</text>
    <text x="166" y="640">근처 스크롤</text>
    <rect x="262" y="568" width="140" height="104" rx="14" fill="#efede7"/>
    <text x="332" y="612">숨긴 iframe에</text>
    <text x="332" y="640">미리 렌더링</text>
    <rect x="428" y="568" width="140" height="104" rx="14" fill="#2f5d3f"/>
    <text x="498" y="612" fill="#ffffff">transform</text>
    <text x="498" y="640" fill="#ffffff">슬라이드 전환</text>
  </g>
  <g stroke="#9a968c" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="238" y1="620" x2="258" y2="620"/>
    <line x1="404" y1="620" x2="424" y2="620"/>
  </g>

  <!-- 스와이프 뒤로가기 -->
  <rect x="632" y="176" width="504" height="528" rx="20" fill="#ffffff" stroke="#e4e1d9" stroke-width="2"/>
  <text x="664" y="224" font-size="24" font-weight="700" fill="#1f2420">iOS 스와이프 뒤로가기 재현</text>

  <rect x="764" y="250" width="240" height="340" rx="30" fill="#f8f7f3" stroke="#1f2420" stroke-width="4"/>
  <rect x="844" y="262" width="80" height="16" rx="8" fill="#1f2420"/>
  <!-- 끌려 나가는 현재 페이지 -->
  <rect x="880" y="292" width="118" height="286" rx="6" fill="#ffffff" stroke="#d6d2c8" stroke-width="2"/>
  <rect x="896" y="312" width="86" height="12" rx="6" fill="#d6d2c8"/>
  <rect x="896" y="336" width="64" height="12" rx="6" fill="#e4e1d9"/>
  <rect x="896" y="360" width="76" height="12" rx="6" fill="#e4e1d9"/>
  <!-- 가장자리 2.5rem -->
  <rect x="770" y="292" width="26" height="286" fill="#2f5d3f" fill-opacity="0.18"/>
  <!-- 너비 40% -->
  <line x1="862" y1="286" x2="862" y2="584" stroke="#2f5d3f" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="784" y1="470" x2="930" y2="470" stroke="#2f5d3f" stroke-width="4" stroke-linecap="round" marker-end="url(#drag)"/>
  <circle cx="784" cy="470" r="11" fill="#2f5d3f"/>

  <g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="738" cy="436" r="16" fill="#2f5d3f"/>
    <text x="738" y="442">1</text>
    <circle cx="862" cy="608" r="16" fill="#2f5d3f"/>
    <text x="862" y="614">2</text>
  </g>
  <line x1="752" y1="436" x2="770" y2="436" stroke="#2f5d3f" stroke-width="2"/>
  <line x1="862" y1="584" x2="862" y2="592" stroke="#2f5d3f" stroke-width="2"/>

  <g font-size="20" fill="#1f2420">
    <text x="664" y="654"><tspan font-weight="700" fill="#2f5d3f">1</tspan>  왼쪽 가장자리 2.5rem 안에서 시작</text>
    <text x="664" y="686"><tspan font-weight="700" fill="#2f5d3f">2</tspan>  너비의 40%를 넘기면 뒤로가기 실행</text>
  </g>
</svg>
